name: Ban tin sang hang ngay

on:
  schedule:
    # 0h UTC = 7h sang gio Viet Nam (UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # cho phep bam nut chay thu bang tay tren tab Actions

jobs:
  keo-tin:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # can quyen nay de commit ket qua nguoc lai repo
    steps:
      - name: Lay code trong repo
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien can thiet
        run: pip install feedparser vnstock

      - name: Chay script keo tin (markdown log)
        run: |
          mkdir -p docs
          python3 kero_tin.py --hours 15 --out "docs/$(date +%F).md"

      - name: Tao dashboard HTML (trang hien thi)
        run: |
          python3 generate_report.py --hours 15 --out docs/index.html

      - name: Luu ket qua vao repo
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "Khong co gi moi" || git commit -m "Ban tin $(date +%F)"
          git pull --rebase origin main
          git push
